services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction

  # Database setup service - runs migrations and seeds initial data
  db-setup:
    build:
      context: .
      dockerfile: shared/database/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
    depends_on:
      - postgres
    volumes:
      - ./shared/database:/app/shared/database
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/shared/database/node_modules
    command: ["npm", "run", "db:setup"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      MNEMONIC: ${MNEMONIC}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL}
    depends_on:
      postgres:
        condition: service_started
      db-setup:
        condition: service_completed_successfully
    volumes:
      - ./api:/app/api
      - ./shared:/app/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
  
  farcaster:
    build:
      context: .
      dockerfile: farcaster/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${FARCASTER_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_AI_AGENT_URL: ${VITE_AI_AGENT_URL}
      VITE_SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      VITE_BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    volumes:
      - ./farcaster:/app/farcaster
      - ./shared:/app/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    command: npm run dev


volumes:
  postgres_data:
  redis_data: