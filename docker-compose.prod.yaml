# Production stack. Postgres runs locally in this compose file (unlike
# scamstaker's external Neon setup) - everything else only ever pulls
# prebuilt GHCR images, never builds locally (see .github/workflows/
# deploy.yml, which builds+pushes on CI success and then SSHes in here to
# `pull` + `up -d`).
#
# Secrets/config: each service reads real values from .env.production,
# which you manage directly on the box (never committed - see .gitignore).
# GHCR_OWNER (your GitHub username/org, used in the image: lines below)
# needs to be set in there too. Compose itself only auto-loads a file
# literally named `.env` for the ${GHCR_OWNER}/${IMAGE_TAG} substitution
# below - on the box, symlink `.env -> .env.production` once. IMAGE_TAG
# isn't stored anywhere - the deploy workflow passes it inline per-run
# (defaults to `latest` otherwise).
#
# api and web have no host port bindings - Caddy reaches them by service
# name over the compose network and is the only thing exposed to the host
# (ports 80/443 below), matching scamstaker's paradigm.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs once per deploy, applies migrations + seeds the admin user
  # (db:setup:prod = build && db:migrate && db:seed:dev - see
  # shared/database/package.json).
  db-setup:
    image: ghcr.io/${GHCR_OWNER}/relic-safari-db-setup:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/${GHCR_OWNER}/relic-safari-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      DOMAIN_NAME: ${DOMAIN_NAME}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  # React Router SSR frontend. VITE_API_URL/VITE_SEPOLIA_RPC_URL are NOT
  # listed here - they're Vite build-time envs baked into the image itself
  # (see web/Dockerfile.prod's ARG/ENV bridge and deploy.yml's build-args),
  # not something the running container reads. web/app/lib/api.ts hardcodes
  # API_BASE="/api" (relative, same-origin) - the Caddyfile below routes
  # /api/* to the api service and everything else to this one.
  web:
    image: ghcr.io/${GHCR_OWNER}/relic-safari-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Reverse proxy + automatic Let's Encrypt HTTPS - see ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
